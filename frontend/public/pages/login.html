<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Edital → Plano Diário</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    .login-container {
      max-width: 400px;
      margin: 60px auto;
    }
    .login-card {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }
    .login-card h1 {
      text-align: center;
      color: #667eea;
      margin-bottom: 30px;
    }
    .form-toggle {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
    .form-toggle a {
      color: #667eea;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>📚 Edital → Plano Diário</h1>
      
      <div id="alertContainer"></div>

      <form id="loginForm" style="display: block;">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Senha</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button type="submit" style="width: 100%; margin-top: 20px;">Entrar</button>
        <div class="form-toggle">
          Não tem conta? <a onclick="toggleForm()">Registre-se</a>
        </div>
      </form>

      <form id="registerForm" style="display: none;">
        <div class="form-group">
          <label for="registerName">Nome</label>
          <input type="text" id="registerName" required>
        </div>
        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" required>
        </div>
        <div class="form-group">
          <label for="registerPassword">Senha</label>
          <input type="password" id="registerPassword" required>
        </div>
        <button type="submit" style="width: 100%; margin-top: 20px;">Registrar</button>
        <div class="form-toggle">
          Já tem conta? <a onclick="toggleForm()">Faça login</a>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    function showAlert(message, type = 'info') {
      const container = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert ${type}`;
      alert.textContent = message;
      container.innerHTML = '';
      container.appendChild(alert);
    }

    function toggleForm() {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      loginForm.style.display = loginForm.style.display === 'none' ? 'block' : 'none';
      registerForm.style.display = registerForm.style.display === 'none' ? 'block' : 'none';
      document.getElementById('alertContainer').innerHTML = '';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const result = await api.auth.login(email, password);
        auth.setToken(result.token);
        window.location.href = './dashboard.html';
      } catch (error) {
        showAlert(error.message, 'error');
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('registerName').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;

      try {
        await api.auth.register(name, email, password);
        showAlert('Registrado com sucesso! Faça login agora.', 'success');
        setTimeout(() => toggleForm(), 2000);
      } catch (error) {
        showAlert(error.message, 'error');
      }
    });
  </script>
</body>
</html>
