<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurar Concurso - Edital → Plano Diário</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <div class="header">
    <div class="container">
      <h1>📚 Edital → Plano Diário</h1>
      <div class="nav">
        <a href="./dashboard.html">Dashboard</a>
        <a href="./today.html">Hoje</a>
        <a href="./evolution.html">Evolução</a>
        <button onclick="logout()">Sair</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div id="alertContainer"></div>

    <div class="card">
      <h2>⚙️ Configurar Concurso</h2>
      <div id="examInfo"></div>
    </div>

    <div class="card">
      <h2>📚 Disciplinas</h2>
      <button onclick="showSubjectForm()">+ Adicionar Disciplina</button>
      <div id="subjectsList" style="margin-top: 20px;"></div>
    </div>

    <div id="subjectFormContainer" style="display: none;" class="card">
      <h2>Nova Disciplina</h2>
      <form id="subjectForm">
        <div class="form-group">
          <label for="subjectName">Nome da Disciplina</label>
          <input type="text" id="subjectName" required>
        </div>
        <div class="form-group">
          <label for="subjectWeight">Peso (0-1)</label>
          <input type="number" id="subjectWeight" min="0" max="1" step="0.1" required>
        </div>
        <button type="submit">Adicionar</button>
        <button type="button" onclick="hideSubjectForm()" style="background: #ccc; color: #333;">Cancelar</button>
      </form>
    </div>

    <div class="card">
      <h2>⏰ Disponibilidade de Estudo</h2>
      <form id="availabilityForm">
        <div class="form-group">
          <label for="hoursPerDay">Horas por dia</label>
          <input type="number" id="hoursPerDay" min="0.5" max="12" step="0.5" required>
        </div>
        <div class="form-group">
          <label>Dias disponíveis</label>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">
            <label><input type="checkbox" name="day" value="monday"> Segunda</label>
            <label><input type="checkbox" name="day" value="tuesday"> Terça</label>
            <label><input type="checkbox" name="day" value="wednesday"> Quarta</label>
            <label><input type="checkbox" name="day" value="thursday"> Quinta</label>
            <label><input type="checkbox" name="day" value="friday"> Sexta</label>
            <label><input type="checkbox" name="day" value="saturday"> Sábado</label>
            <label><input type="checkbox" name="day" value="sunday"> Domingo</label>
          </div>
        </div>
        <div class="form-group">
          <label for="baseLevel">Nível de Base</label>
          <select id="baseLevel">
            <option value="iniciante">Iniciante</option>
            <option value="intermediario">Intermediário</option>
            <option value="avancado">Avançado</option>
          </select>
        </div>
        <button type="submit" style="width: 100%;">Salvar Disponibilidade</button>
      </form>
      <button onclick="generateSchedule()" style="width: 100%; margin-top: 15px; background: #4caf50;">Gerar Cronograma</button>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    const formatting = require('../js/utils.js');
    const params = new URLSearchParams(window.location.search);
    const examId = params.get('id');

    if (!auth.isAuthenticated()) {
      window.location.href = './login.html';
    }

    if (!examId) {
      window.location.href = './dashboard.html';
    }

    function showAlert(message, type = 'info') {
      const container = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert ${type}`;
      alert.textContent = message;
      container.innerHTML = '';
      container.appendChild(alert);
    }

    function logout() {
      auth.logout();
    }

    function showSubjectForm() {
      document.getElementById('subjectFormContainer').style.display = 'block';
    }

    function hideSubjectForm() {
      document.getElementById('subjectFormContainer').style.display = 'none';
      document.getElementById('subjectForm').reset();
    }

    async function loadExamDetails() {
      try {
        const exam = await api.exams.get(examId);
        document.getElementById('examInfo').innerHTML = `
          <p><strong>${exam.name}</strong></p>
          <p>📅 Prova: ${formatting.formatDate(exam.exam_date)}</p>
        `;
        
        loadSubjects();
      } catch (error) {
        showAlert(error.message, 'error');
      }
    }

    async function loadSubjects() {
      try {
        const subjects = await api.subjects.list(examId);
        const subjectsList = document.getElementById('subjectsList');
        
        if (subjects.length === 0) {
          subjectsList.innerHTML = '<p style="color: #999;">Nenhuma disciplina cadastrada</p>';
          return;
        }

        subjectsList.innerHTML = subjects.map(subject => `
          <div class="task-item">
            <div>
              <strong>${subject.name}</strong>
              <p>Peso: ${(subject.weight * 100).toFixed(0)}%</p>
            </div>
            <button class="btn-small" onclick="deleteSubject('${subject.id}')">Deletar</button>
          </div>
        `).join('');
      } catch (error) {
        showAlert(error.message, 'error');
      }
    }

    async function deleteSubject(subjectId) {
      if (!confirm('Tem certeza?')) return;
      try {
        await api.subjects.delete(examId, subjectId);
        showAlert('Disciplina deletada', 'success');
        loadSubjects();
      } catch (error) {
        showAlert(error.message, 'error');
      }
    }

    async function generateSchedule() {
      try {
        await api.tasks.generate(examId);
        showAlert('Cronograma gerado com sucesso!', 'success');
      } catch (error) {
        showAlert(error.message, 'error');
      }
    }

    document.getElementById('subjectForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('subjectName').value;
      const weight = parseFloat(document.getElementById('subjectWeight').value);

      try {
        await api.subjects.create(examId, { name, weight });
        showAlert('Disciplina criada!', 'success');
        hideSubjectForm();
        loadSubjects();
      } catch (error) {
        showAlert(error.message, 'error');
      }
    });

    document.getElementById('availabilityForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const hoursPerDay = parseFloat(document.getElementById('hoursPerDay').value);
      const days = Array.from(document.querySelectorAll('input[name="day"]:checked')).map(d => d.value);
      const baseLevel = document.getElementById('baseLevel').value;

      if (days.length === 0) {
        showAlert('Selecione pelo menos um dia', 'error');
        return;
      }

      try {
        await api.studyPlans.create(examId, {
          hours_per_day: hoursPerDay,
          available_days: days,
          base_level: baseLevel,
        });
        showAlert('Disponibilidade salva!', 'success');
      } catch (error) {
        showAlert(error.message, 'error');
      }
    });

    loadExamDetails();
  </script>
</body>
</html>
