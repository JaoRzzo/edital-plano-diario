<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoje - Edital → Plano Diário</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    .today-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 0;
      margin-bottom: 30px;
      text-align: center;
    }
    .today-date {
      font-size: 48px;
      font-weight: bold;
      margin: 20px 0;
    }
    .today-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .stat-number {
      font-size: 32px;
      font-weight: bold;
      color: #667eea;
      margin: 10px 0;
    }
    .stat-label {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
    }
    .task-time-input {
      width: 80px;
      padding: 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="container">
      <h1>📚 Edital → Plano Diário</h1>
      <div class="nav">
        <a href="./dashboard.html">Dashboard</a>
        <a href="./today.html">Hoje</a>
        <a href="./evolution.html">Evolução</a>
        <button onclick="logout()">Sair</button>
      </div>
    </div>
  </div>

  <div class="today-header">
    <div class="container">
      <p>TAREFAS DE HOJE</p>
      <div class="today-date" id="todayDate"></div>
      <p id="dayName"></p>
    </div>
  </div>

  <div class="container">
    <div id="alertContainer"></div>

    <div class="today-stats">
      <div class="stat-card">
        <div class="stat-label">Tarefas</div>
        <div class="stat-number" id="totalTasks">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Concluídas</div>
        <div class="stat-number" id="completedTasks">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Tempo Gasto</div>
        <div class="stat-number" id="totalTime">0h</div>
      </div>
    </div>

    <div class="card">
      <h2>📋 Tarefas de Hoje</h2>
      <div id="todayTasksList"></div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    const formatting = require('../js/utils.js');

    if (!auth.isAuthenticated()) {
      window.location.href = './login.html';
    }

    function showAlert(message, type = 'info') {
      const container = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert ${type}`;
      alert.textContent = message;
      container.innerHTML = '';
      container.appendChild(alert);
    }

    function logout() {
      auth.logout();
    }

    async function loadTodaysTasks() {
      try {
        // Formatar data de hoje
        const today = new Date();
        document.getElementById('todayDate').textContent = today.getDate();
        document.getElementById('dayName').textContent = formatting.getDayName(today);

        // Aqui você precisa chamar um endpoint que retorne tarefas de hoje
        // Por enquanto, vou simular
        const tasksList = document.getElementById('todayTasksList');
        tasksList.innerHTML = `
          <div style="text-align: center; color: #999; padding: 40px;">
            <p>Nenhuma tarefa para hoje</p>
            <p style="font-size: 12px; margin-top: 10px;">Crie um plano de estudo no dashboard</p>
          </div>
        `;
      } catch (error) {
        showAlert(error.message, 'error');
      }
    }

    loadTodaysTasks();
  </script>
</body>
</html>
